<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Link API Probe — Authenticate</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --text: #e7ecf3;
      --muted: #8b9bb4;
      --accent: #3d8bfd;
      --ok: #3dd68c;
      --err: #f07178;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-sans-serif, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 2rem;
    }
    h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 0.5rem; }
    p.note { color: var(--muted); font-size: 0.875rem; margin: 0 0 1.5rem; max-width: 40rem; }
    button {
      appearance: none;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    button:hover:not(:disabled) { filter: brightness(1.08); }
    pre {
      margin-top: 1.5rem;
      padding: 1rem 1.25rem;
      background: var(--panel);
      border-radius: 8px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.8125rem;
      line-height: 1.5;
      min-height: 4rem;
    }
    .status-ok { color: var(--ok); }
    .status-err { color: var(--err); }
  </style>
</head>
<body>
  <h1>API Probe — Client Credentials</h1>
  <p class="note">
    POSTs form-urlencoded to the authenticate token endpoint.
    Browser→API calls may fail with a CORS error; if so, the error is shown below.
  </p>
  <button type="button" id="authBtn">Authenticate</button>
  <pre id="out">Click Authenticate to run the request.</pre>

  <script>
    const ENDPOINT =
      'https://api-test.tharwatt.com:5223/accounts/v1/authenticate/token'
    const BODY = new URLSearchParams({
      grant_type: 'client_credentials',
      client_id: 'open-app',
      client_secret: '123456',
    })

    const out = document.getElementById('out')
    const btn = document.getElementById('authBtn')

    btn.addEventListener('click', async () => {
      btn.disabled = true
      out.textContent = 'Requesting…'
      out.className = ''

      try {
        const res = await fetch(ENDPOINT, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
            Accept: 'application/json',
          },
          body: BODY.toString(),
        })

        const text = await res.text()
        let pretty = text
        try {
          pretty = JSON.stringify(JSON.parse(text), null, 2)
        } catch {
          /* keep raw text */
        }

        out.className = res.ok ? 'status-ok' : 'status-err'
        out.textContent =
          `Status: ${res.status} ${res.statusText}\n` +
          `URL: ${ENDPOINT}\n\n` +
          `Response body:\n${pretty || '(empty)'}`
      } catch (err) {
        const msg = err instanceof Error ? err.message : String(err)
        const isCors =
          /Failed to fetch|NetworkError|CORS|cross-origin/i.test(msg) ||
          err instanceof TypeError

        out.className = 'status-err'
        out.textContent =
          `Request failed (likely CORS or network block).\n\n` +
          `Error: ${msg}\n\n` +
          (isCors
            ? 'CORS note: The browser blocked this cross-origin call. ' +
              'Use curl, a server-side proxy, or ask the API to allow your origin.\n'
            : '') +
          `\nEndpoint: ${ENDPOINT}`
      } finally {
        btn.disabled = false
      }
    })
  </script>
</body>
</html>
